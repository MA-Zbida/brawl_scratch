# Defaults for every run (research/DESIGN.md). An experiment file overrides them; a key that is not
# here is rejected (brawl/config.py).
env:
  regime: realtime      # realtime (the target setting) | stepped (the oracle: the game waits)
  k: 3                  # game frames per decision
  difficulty: medium    # the bot's level; set by hand in the game, recorded with the run
  damage_weight: 0.01   # reward = damage_weight * (dealt - taken) + ko_weight * (stocks taken - lost)
  ko_weight: 1.0
  detector: runs/detector/armed_yolo11s-pose_960/weights/best.engine
train:
  learner: ppo          # ppo | rdqn (recurrent Q-learning from demonstrations, brawl/rdqn.py)
  init: null            # ppo: policy.zip of a cloned policy; rdqn: qnet.pt (null: pretrain on the demonstrations first)
  total_steps: 72000    # decisions: one hour of game time at k = 3
  n_steps: 1200         # decisions per rollout (ppo) or per logged block (rdqn): one minute
  checkpoint_every: 10  # rollouts / blocks
  gamma: 0.995          # half-life of about 7 s of game time
  seed: 0
  # -- ppo --
  batch_size: 300
  n_epochs: 5
  learning_rate: 3.0e-4
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net: [256, 256]       # the same network as behaviour cloning
  vf_warmup_rollouts: 0 # rollouts at the start in which only the value function learns
  target_kl: null       # stop an update's epochs once the policy has moved this far
  # -- rdqn --
  rdqn:
    hidden: 256         # GRU size
    drop_history: true  # leave the last actions out of the input (they taught the network to repeat itself)
    burn_in: 16         # decisions replayed to rebuild the memory before the loss
    train_length: 48    # decisions of each sequence that carry the loss
    n_step: 5
    batch: 16           # sequences per update
    learning_rate: 1.0e-4
    target_every: 2000  # updates between target-network copies
    margin: 0.5         # DQfD margin: the human's action must lead the others by this much
    margin_weight: 1.0  # of the margin loss while pretraining
    live_margin_weight: 0.3  # and while playing
    demo_fraction: 0.25 # of each batch, once there is live data
    demo_levels: [easy, medium, hard, extreme, chosen]  # human Wu Shang sessions kept in replay
    pretrain_updates: 20000
    updates_per_decision: 0.4  # 8 updates a second at 20 decisions; the CPU learner manages about 13
    epsilon: 0.02       # share of decisions that explore while training
    explore: human      # an exploring decision takes an action as often as the human took it (uniform: any of the 54;
                        # at 0.05 uniform the agent threw its weapon 10 times a minute and was armed 47% of the time)
    rollback: 1.0       # reward per minute: when the last 30 minutes fall this far below the best 30, go back to best.pt
    bootstrap: double_q # double_q: values the best next action; sarsa: values the action actually taken (no max, no inflation)
    prior: null         # a cloned policy.zip: the agent samples from it, its odds shifted by the Q-network's advantages
                        # (logits + beta * clipped advantage). null: the agent takes the Q-network's best action
    beta: 0.0           # how strongly the advantages shift the cloned policy, once ramped
    beta_after: 36000   # decisions played as the pure clone first (30 minutes: the run's own baseline)
    beta_ramp: 36000    # decisions over which beta then rises to its value
    adv_clip: 0.2       # advantages are clipped to this, so the odds of an action change by at most exp(beta * adv_clip)
    trace_crops: false  # save both fighters' 96 px crops with every traced decision (about 1 GB an hour, compressed)
    sync_every: 100     # updates between weight files for the actor
    capacity: 600000    # live decisions kept
    threads: 4          # CPU threads of the learner
    device: cpu         # the learner's device while the game runs (the detector keeps the GPU)
    watchdog_decisions: 1200  # stop when the HUD is unreadable this long (the game left the fight)
